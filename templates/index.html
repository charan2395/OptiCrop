 <!DOCTYPE html>
<html>
<head<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">>
    <title>OptiCrop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">
        <h2 class="text-center text-success">🌾 OptiCrop Smart Crop Predictor</h2>

        <form action="/predict" method="POST" class="mt-4">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <input name="n" class="form-control" placeholder="Nitrogen (N)" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input name="p" class="form-control" placeholder="Phosphorous (P)" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input name="k" class="form-control" placeholder="Potassium (K)" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input name="temp" class="form-control" placeholder="Temperature" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input name="humidity" class="form-control" placeholder="Humidity" required>
                </div>

                <div class="col-md-6 mb-3">
                    <input name="ph" class="form-control" placeholder="pH Value" required>
                </div>

                <div class="col-md-12 mb-3">
                    <input name="rainfall" class="form-control" placeholder="Rainfall" required>
                </div>
            </div>

            <button class="btn btn-success w-100">Predict Crop</button>

        </form>
    </div>

</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
